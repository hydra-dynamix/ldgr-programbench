[adapter]
slug = "programbench"
title = "ProgramBench on-host run adapter"
core_version = "generated"
aliases = ["ldgr-programbench"]

[profile]
loop_prompt_path = "docs/programbench-run.md"
default_milestone_template = "docs/historical/classifications.json"
spec_artifact_path = "docs/historical/source-manifest.json"
readiness_policy = "Use the default harness from the LDGR user config, prepare one bounded task with sensible local defaults, retain evaluation evidence, and never describe the on-host result as an official submission, clean-room run, independent benchmark, or general model score."

[[commands]]
namespace = "programbench"
argv = ["ldgr-programbench"]
aliases = []
title = "LDGR ProgramBench run commands"
description = "Set up, run, evaluate, verify, and report one bounded on-host ProgramBench attempt."
capabilities = ["dispatch", "help"]

[commands.help]
usage = "ldgr programbench <setup|reproduce|verify|report> [options]"
summary = "Run ProgramBench with the harness selected in the user's LDGR config."
details = "Reproduce prepares and executes a new attempt; verify checks its results. This is not an official submission or clean-room benchmark surface."

[[target_profiles]]
slug = "programbench-on-host-attempt"
title = "On-host ProgramBench attempt"
target_type = "bounded-reproduction"
description = "One prepared, harness-driven ProgramBench attempt with LDGR run evidence."

[[target_profiles.probes]]
slug = "execution"
title = "Harness execution"
description = "The configured user harness produces a candidate in a prepared ProgramBench workspace."
validation_hint = "ldgr programbench reproduce"

[[target_profiles.probes]]
slug = "evaluation"
title = "Evaluation evidence"
description = "ProgramBench evaluation artifacts are present, parseable, summarized, and attached to an LDGR run."
validation_hint = "ldgr programbench verify"
