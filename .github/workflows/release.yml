name: Binary release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ldgr-programbench
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, platform: linux-x86_64, ext: ""}
          - {os: ubuntu-24.04-arm, platform: linux-aarch64, ext: ""}
          - {os: macos-15-intel, platform: macos-x86_64, ext: ""}
          - {os: macos-14, platform: macos-aarch64, ext: ""}
          - {os: windows-latest, platform: windows-x86_64, ext: ".exe"}
    env:
      GH_TOKEN: ${{ secrets.LDGR_RELEASES_TOKEN }}
      RELEASE_REPO: hydra-dynamix/ldgr-releases
      SIGNING_KEY: ${{ secrets.LDGR_RELEASE_SIGNING_KEY_PEM }}
      SIGNING_KEY_ID: ${{ vars.LDGR_RELEASE_SIGNING_KEY_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: ldgr-programbench
      - uses: actions/checkout@v5
        with:
          repository: hydra-dynamix/ldgr-core
          ref: 31b8a2e7bfcf1791fe9d1b7c607de74e3d94e461
          path: ldgr-core
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked && cargo build --locked --release
      - name: Materialize and package
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          root="ldgr-programbench-${version}"
          mkdir -p "dist/$root/${{ matrix.platform }}"
          cargo run --locked --release -- adapter install --install-root "dist/$root"
          cmp adapter-compatibility.json "dist/$root/adapter-compatibility.json"
          cp "target/release/ldgr-programbench${{ matrix.ext }}" "dist/$root/${{ matrix.platform }}/ldgr-programbench${{ matrix.ext }}"
          tar -C dist -czf "dist/$root-${{ matrix.platform }}.tar.gz" "$root"
          archive="dist/$root-${{ matrix.platform }}.tar.gz"
          if command -v sha256sum >/dev/null 2>&1; then
            digest=$(sha256sum "$archive" | awk '{print $1}')
          else
            digest=$(shasum -a 256 "$archive" | awk '{print $1}')
          fi
          printf '%s' "$SIGNING_KEY" > signing.pem
          openssl_bin="openssl"
          if [[ "$RUNNER_OS" == "macOS" ]]; then openssl_bin="$(brew --prefix openssl@3)/bin/openssl"; fi
          "$openssl_bin" pkeyutl -sign -rawin -inkey signing.pem -in "$archive" -out signature.raw
          signature=$("$openssl_bin" base64 -A -in signature.raw)
          jq -n --arg key_id "$SIGNING_KEY_ID" --arg signature "$signature" '{algorithm:"Ed25519",key_id:$key_id,signature:$signature}' > "$archive.sig"
          python3 - "dist/$root-${{ matrix.platform }}.index-entry.json" "$version" "${{ matrix.platform }}" "$digest" "ldgr-programbench${{ matrix.ext }}" <<'PY'
          import hashlib,json,pathlib,sys,os
          output,version,platform,digest,binary=sys.argv[1:]
          sidecar_path=pathlib.Path("adapter-compatibility.json"); sidecar=json.loads(sidecar_path.read_text())
          compatibility=sidecar["compatibility"]
          fingerprint="sha256:"+hashlib.sha256(json.dumps(compatibility,sort_keys=True,separators=(",", ":")).encode()).hexdigest()
          base=f"https://github.com/hydra-dynamix/ldgr-releases/releases/download/programbench-v{version}/ldgr-programbench-{version}-{platform}.tar.gz"
          product={"domain":"programbench","primary_namespace":"programbench","title":"ProgramBench on-host run adapter","aliases":[],"classification":"open_source","source_url":"https://github.com/hydra-dynamix/ldgr-programbench","releases":[{"version":version,"channel":"stable","compatibility":compatibility,"compatibility_sha256":fingerprint,"platforms":[{"platform":platform,"asset_url":base,"archive_root":f"ldgr-programbench-{version}","binary":binary,"sha256":digest,"signature_url":base+".sig","signing_key_id":os.environ["SIGNING_KEY_ID"],"resource_manifest":"adapter-resources.json"}]}]}
          fragment={"format":"ldgr.adapter-release-fragment.v2","product":product,"sidecar_sha256":"sha256:"+hashlib.sha256(sidecar_path.read_bytes()).hexdigest()}
          pathlib.Path(output).write_text(json.dumps(fragment,sort_keys=True,indent=2)+"\n")
          PY
          rm -f signing.pem signature.raw
      - uses: anchore/sbom-action@v0
        with:
          path: ldgr-programbench/dist
          format: spdx-json
          output-file: ldgr-programbench/dist/programbench-${{ matrix.platform }}.sbom.spdx.json
          upload-artifact: false
      - name: Publish central release
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          tag="programbench-v$version"
          if ! gh release view "$tag" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$RELEASE_REPO" --draft --title "ldgr-programbench v$version" --notes "Compatibility-v2 candidate. Runs one bounded ProgramBench attempt with the user's configured LDGR harness; publish only through the ldgr-releases catalog gate." || gh release view "$tag" --repo "$RELEASE_REPO" >/dev/null
          fi
          gh release upload "$tag" --repo "$RELEASE_REPO" dist/*-${{ matrix.platform }}* --clobber
